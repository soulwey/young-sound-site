services:
  - type: web
    name: young-sound-studio
    runtime: static
    buildCommand: echo "Static Young Sound site — no build needed"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin